# 素材包中繼資料目錄
#
# 掃描能自動得到的只有「這個壓縮檔存在、裡面有這些內容」。作者、授權、
# AI 使用揭露、購買來源無法從檔名或內容推導 —— 而且盤點證實廠商壓縮檔裡
# 有沒有這些資訊完全看運氣:Crusenho 附了完整 License.txt,四個 Effects 包
# 什麼都沒有。所以這些是資料,由人維護。
#
# 套用方式:
#   assetdb pack apply --catalogue data/packs.toml
#
# `archive` 以**基本檔名**比對,不是完整路徑 —— 重構會改變目錄結構,
# 但廠商的壓縮檔檔名不會變。
#
# `license` 引用 licenses 資料表裡的名稱(見 store/src/AssetDB/Store/Schema.hs
# 的種子資料)。同一份授權涵蓋多個素材包時不必重複描述。
#
# `ai` 的值:unknown(還沒查)/ none(作者明確聲明未使用)/ assisted / generated。
# unknown 與 none 意義不同,發行前稽核只接受 none。

schema = 1

